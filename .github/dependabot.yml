version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, timezone: Asia/Kolkata }
    target-branch: develop
    open-pull-requests-limit: 10
    cooldown: { default-days: 7 }
    commit-message: { prefix: 'build', include: scope }
    # @types/node must match the Node major we run (24: engines, Docker images, CI). Newer
    # majors would type-check APIs that don't exist at runtime. Bump all of them together.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint']
      lint-and-format:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier', '@commitlint/*']
      test:
        patterns: ['vitest', '@vitest/*', 'supertest', '@types/supertest', 'jsdom']
      types:
        patterns: ['@types/*']

  - package-ecosystem: docker
    directories: ['/docker']
    schedule: { interval: weekly, day: monday, timezone: Asia/Kolkata }
    target-branch: develop
    commit-message: { prefix: 'build' }
    # Node majors move together with @types/node, engines and CI (see above).
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, timezone: Asia/Kolkata }
    target-branch: develop
    commit-message: { prefix: 'ci' }
    groups:
      actions:
        patterns: ['*']
