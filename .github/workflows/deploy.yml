name: Deploy

# Build once, deploy the same images everywhere:
#   push to main        → build + push images → migrate staging → deploy staging → smoke test
#                       → (approval) migrate production → deploy production → smoke test
#   workflow_dispatch   → redeploy an existing image tag (rollback), optionally skipping migrations
#
# The approval gate is the "production" GitHub environment's required reviewers
# (Settings → Environments). Deploys are triggered through a hosting provider's deploy hook,
# so this workflow does not depend on a particular host; see docs/runbook.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (a previous commit SHA to roll back)'
        required: true
      run_migrations:
        description: 'Run database migrations before deploying'
        type: boolean
        default: false

permissions:
  contents: read

# Never run two deploys at once; never cancel one half-way.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  images:
    name: Build and push images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  tag:
    name: Resolve image tag
    runs-on: ubuntu-latest
    needs: [images]
    if: always() && (needs.images.result == 'success' || github.event_name == 'workflow_dispatch')
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      migrate: ${{ steps.t.outputs.migrate }}
    steps:
      - id: t
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          INPUT_MIGRATE: ${{ inputs.run_migrations }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Only commit SHAs: refuses anything that could be read as a shell or path.
            echo "$INPUT_TAG" | grep -Eq '^[0-9a-f]{7,40}$' || { echo "image_tag must be a commit SHA"; exit 1; }
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "migrate=$INPUT_MIGRATE" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "migrate=true" >> "$GITHUB_OUTPUT"
          fi

  staging:
    name: Staging
    needs: [tag]
    if: always() && needs.tag.result == 'success'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      image_tag: ${{ needs.tag.outputs.tag }}
      run_migrations: ${{ needs.tag.outputs.migrate == 'true' }}
    secrets: inherit
    permissions:
      contents: read
      packages: read

  production:
    name: Production
    needs: [tag, staging]
    if: always() && needs.staging.result == 'success'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      image_tag: ${{ needs.tag.outputs.tag }}
      run_migrations: ${{ needs.tag.outputs.migrate == 'true' }}
    secrets: inherit
    permissions:
      contents: read
      packages: read
