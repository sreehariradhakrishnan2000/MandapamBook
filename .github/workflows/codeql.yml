name: CodeQL

on:
  pull_request:
  push:
    branches: [develop, main]
  schedule:
    - cron: '27 3 * * 1' # weekly, Monday 08:57 IST

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # CodeQL reads its own workflow run; required on private repositories
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: javascript-typescript, actions
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      # Public repositories upload results to code scanning. Private repositories without
      # GitHub Code Security can't, so there the results are kept as a file and the job
      # fails on any error- or warning-level finding not in the reviewed accepted list
      # (.github/codeql/accepted-findings.json).
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: codeql-results
      - name: Fail on findings (private repository)
        if: github.event.repository.private
        run: node scripts/codeql-gate.mjs codeql-results
      - if: always() && github.event.repository.private
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif
          path: codeql-results
          retention-days: 14
