name: Deploy to one environment

# Reusable: migrate (separate step, direct DB connection), point each Render service at the
# new image through its deploy hook, then wait until /ready reports healthy on the new version.
#
# Per-environment configuration (Settings → Environments → staging / production):
#   secrets:   MIGRATION_DATABASE_URL     direct (non-pooled) Postgres URL for migrations
#              RENDER_DEPLOY_HOOK_API     the API service's deploy hook URL (contains its key)
#              RENDER_DEPLOY_HOOK_WEB     the web service's deploy hook URL
#              RENDER_DEPLOY_HOOK_WORKER  optional: only with a separate worker service. On
#                                         Render's free tier the API runs the jobs instead
#                                         (RUN_JOBS_IN_PROCESS=true).
#   variables: API_BASE_URL               the API's public URL, e.g. https://….onrender.com
#   production: add required reviewers — that is the approval gate.

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      image_tag:
        type: string
        required: true
      run_migrations:
        type: boolean
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.API_BASE_URL }}
    steps:
      # GHCR image names must be lowercase; github.repository keeps the repo's capitals.
      # image_tag is a validated commit SHA (deploy.yml), so it is safe in the shell.
      - name: Image references
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "API_IMAGE=$prefix-api:$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=$prefix-web:$IMAGE_TAG" >> "$GITHUB_ENV"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check configuration
        env:
          HAS_DB: ${{ secrets.MIGRATION_DATABASE_URL != '' }}
          HAS_API_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API != '' }}
          HAS_WEB_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB != '' }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          missing=""
          [ "$HAS_API_HOOK" = "true" ] || missing="$missing RENDER_DEPLOY_HOOK_API"
          [ "$HAS_WEB_HOOK" = "true" ] || missing="$missing RENDER_DEPLOY_HOOK_WEB"
          [ -n "$API_BASE_URL" ] || missing="$missing API_BASE_URL"
          if [ "${{ inputs.run_migrations }}" = "true" ] && [ "$HAS_DB" != "true" ]; then missing="$missing MIGRATION_DATABASE_URL"; fi
          if [ -n "$missing" ]; then echo "::error::Environment ${{ inputs.environment }} is missing:$missing"; exit 1; fi

      - name: Migrate database (expand-only migrations; see docs/runbook.md)
        if: inputs.run_migrations
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          docker pull "$API_IMAGE"
          docker run --rm -e NODE_ENV=production -e MIGRATION_DATABASE_URL -e DATABASE_URL="$MIGRATION_DATABASE_URL" \
            "$API_IMAGE" node dist/db/migrate.js

      # Render deploy hooks take the image to deploy as a URL-encoded imgURL parameter; it
      # must match the service's image apart from the tag. The hook URLs carry their key, so
      # they stay secrets and are never echoed. Render deploys asynchronously, so for a short
      # while web and API may run different versions; expand-only migrations make that safe.
      - name: Deploy on Render
        env:
          HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
          HOOK_WORKER: ${{ secrets.RENDER_DEPLOY_HOOK_WORKER }}
        run: |
          deploy() {
            local name="$1" hook="$2" image="$3"
            local img; img=$(jq -rn --arg v "$image" '$v | @uri')
            echo "deploying $name -> $image"
            curl --fail-with-body -sS -o /dev/null -w "  render accepted ($name): HTTP %{http_code}\n" \
              -X POST "${hook}&imgURL=${img}"
          }
          deploy api "$HOOK_API" "$API_IMAGE"
          [ -z "$HOOK_WORKER" ] || deploy worker "$HOOK_WORKER" "$API_IMAGE"
          deploy web "$HOOK_WEB" "$WEB_IMAGE"

      - name: Smoke test (/health and /ready on the new deployment)
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          want=$(echo "${{ inputs.image_tag }}" | cut -c1-12)
          for i in $(seq 1 40); do
            got=$(curl -fsS "$API_BASE_URL/health" | jq -r '.version // empty' || true)
            if [ "$got" = "$want" ] && curl -fsS "$API_BASE_URL/ready"; then
              echo; echo "version $got is live and ready"; exit 0
            fi
            echo "waiting: serving '${got:-none}', want '$want'"
            sleep 15
          done
          echo "::error::$API_BASE_URL did not serve version $want healthily within 10 minutes; roll back (docs/runbook.md)"
          exit 1
